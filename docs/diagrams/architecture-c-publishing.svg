<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1060" viewBox="0 0 1460 1060" role="img" aria-labelledby="title description">
<title id="title">C | Approved SharePoint knowledge cards</title>
<desc id="description">Implemented synthetic demo, 7-8 October 2026. Not a production target or a new test result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker></defs>
