</text>
<text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#000000" dominant-baseline="text-before-edge" data-max-width="1380">
<tspan x="40" dy="0">Implemented synthetic demo | 7-8 October 2026 | Original-file permissions are not widened</tspan>
