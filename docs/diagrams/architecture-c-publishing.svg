<g data-node="Evidence boundary"><rect x="40" y="885" width="1380" height="135" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text x="60" y="905" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#000000" dominant-baseline="text-before-edge" data-max-width="1340">
